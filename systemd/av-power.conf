# OC-T-0139 / R-4089: gate startup and cancel the entire scanner cgroup.
[Unit]
Requires=linux-av-power.service
BindsTo=linux-av-power.service
After=linux-av-power.service
# Use the shared policy, including conservative unknown-battery handling.
ConditionACPower=

[Service]
ExecCondition=/bin/sh /usr/local/lib/linux-av/bin/av-root av-power --check-unit %n
# A supervised command can exit 75 before the guardian observes it active.
# Record that interruption without replacing the host's existing ExecStart.
ExecStopPost=/bin/sh /usr/local/lib/linux-av/bin/av-root av-power --finished-unit %n
KillMode=control-group
KillSignal=SIGKILL
TimeoutStopSec=2s
